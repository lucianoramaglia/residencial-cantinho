                "form.messagePlaceholder": "Cantidad de personas, dudas, horarios aproximados, etc.",
                "form.note": "* Formulario de demostración. Después podemos conectarlo a un servicio de email o sistema de reservas.",
                "form.submitDemo": "Enviar (demo)"
            }
        };

        function setLanguage(lang) {
            const dict = translations[lang];
            if (!dict) return;

            document.documentElement.lang = lang;

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key]) el.textContent = dict[key];
            });

            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (dict[key]) el.placeholder = dict[key];
            });

            const btnPt = document.getElementById("btn-pt");
            const btnEs = document.getElementById("btn-es");
            if (lang === "pt") {
                btnPt.classList.add("bg-slate-100", "border-slate-300", "font-medium");
                btnEs.classList.remove("bg-slate-100", "border-slate-300", "font-medium");
            } else {
                btnEs.classList.add("bg-slate-100", "border-slate-300", "font-medium");
                btnPt.classList.remove("bg-slate-100", "border-slate-300", "font-medium");
            }
        }

        document.getElementById("btn-pt").addEventListener("click", () => setLanguage("pt"));
        document.getElementById("btn-es").addEventListener("click", () => setLanguage("es"));

        // Idioma por defecto
        setLanguage("pt");
    </script>
</body>

</html>
