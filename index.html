        function setLanguage(lang) {
            const dict = translations[lang];
            if (!dict) return;

            document.documentElement.lang = lang;

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.dataset.i18n;
                if (dict[key]) el.textContent = dict[key];
            });

            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (dict[key]) el.placeholder = dict[key];
            });

            const btnPt = document.getElementById("btn-pt");
            const btnEs = document.getElementById("btn-es");
            if (lang === "pt") {
                btnPt.classList.add("bg-slate-100", "border-slate-300", "font-medium");
                btnEs.classList.remove("bg-slate-100", "border-slate-300", "font-medium");
            } else {
                btnEs.classList.add("bg-slate-100", "border-slate-300", "font-medium");
                btnPt.classList.remove("bg-slate-100", "border-slate-300", "font-medium");
            }

            // Actualizar links de WhatsApp según idioma
            const waMain = document.getElementById("whatsapp-main");
            const waContact = document.getElementById("whatsapp-contact");
            if (waMain && whatsappLinks[lang]) waMain.href = whatsappLinks[lang];
            if (waContact && whatsappLinks[lang]) waContact.href = whatsappLinks[lang];

            // Actualizar idioma en el hidden del formulario
            const langInput = document.getElementById("form-lang");
            if (langInput) langInput.value = lang;

            // Guardar preferencia en localStorage
            localStorage.setItem('preferredLang', lang);
        }

        document.getElementById("btn-pt").addEventListener("click", () => setLanguage("pt"));
        document.getElementById("btn-es").addEventListener("click", () => setLanguage("es"));

        // Cargar idioma guardado o usar 'pt' por defecto
        const savedLang = localStorage.getItem('preferredLang') || 'pt';
        setLanguage(savedLang);

        // Validación de fechas
        function validateDates() {
            const checkIn = document.getElementById("check-in");
            const checkOut = document.getElementById("check-out");
            const checkInError = document.getElementById("check-in-error");
            const checkOutError = document.getElementById("check-out-error");
            const currentLang = document.documentElement.lang;
            const dict = translations[currentLang];
            let isValid = true;

            // Ocultar errores previos
            checkInError.classList.add("hidden");
            checkOutError.classList.add("hidden");
            checkIn.classList.remove("border-red-500");
            checkOut.classList.remove("border-red-500");

            // Establecer fecha mínima (hoy)
            const today = new Date().toISOString().split('T')[0];
            checkIn.setAttribute('min', today);
            checkOut.setAttribute('min', today);

            if (checkIn.value) {
                const checkInDate = new Date(checkIn.value);
                const todayDate = new Date();
                todayDate.setHours(0, 0, 0, 0);

                // Validar que check-in no sea en el pasado
                if (checkInDate < todayDate) {
                    checkInError.textContent = dict["form.error.pastDate"];
                    checkInError.classList.remove("hidden");
                    checkIn.classList.add("border-red-500");
                    isValid = false;
                }

                // Si hay check-out, validar que sea posterior a check-in
                if (checkOut.value) {
                    const checkOutDate = new Date(checkOut.value);
                    if (checkOutDate <= checkInDate) {
                        checkOutError.textContent = dict["form.error.checkoutBeforeCheckin"];
                        checkOutError.classList.remove("hidden");
                        checkOut.classList.add("border-red-500");
                        isValid = false;
                    }
                }
            }

            if (checkOut.value) {
                const checkOutDate = new Date(checkOut.value);
                const todayDate = new Date();
                todayDate.setHours(0, 0, 0, 0);

                // Validar que check-out no sea en el pasado
                if (checkOutDate < todayDate) {
                    checkOutError.textContent = dict["form.error.pastDate"];
                    checkOutError.classList.remove("hidden");
                    checkOut.classList.add("border-red-500");
                    isValid = false;
                }
            }

            return isValid;
        }

        // Event listeners para validación de fechas
        const checkInInput = document.getElementById("check-in");
        const checkOutInput = document.getElementById("check-out");
        const contactForm = document.querySelector('form[action*="formspree"]');

        if (checkInInput) {
            checkInInput.addEventListener('change', validateDates);
            checkInInput.addEventListener('input', validateDates);
        }

        if (checkOutInput) {
            checkOutInput.addEventListener('change', validateDates);
            checkOutInput.addEventListener('input', validateDates);
        }

        // Prevenir envío si hay errores de validación
        if (contactForm) {
            contactForm.addEventListener('submit', function(e) {
                if (!validateDates()) {
                    e.preventDefault();
                }
            });
        }

        // Menú móvil
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenuClose = document.getElementById("mobile-menu-close");
        const mobileMenu = document.getElementById("mobile-menu");
        const mobileMenuOverlay = document.getElementById("mobile-menu-overlay");
        const mobileMenuLinks = mobileMenu.querySelectorAll('a');

        function openMobileMenu() {
            mobileMenu.classList.remove("translate-x-full");
            mobileMenuOverlay.classList.remove("hidden");
            document.body.style.overflow = "hidden";
            mobileMenuBtn.setAttribute("aria-expanded", "true");
        }

        function closeMobileMenu() {
            mobileMenu.classList.add("translate-x-full");
            mobileMenuOverlay.classList.add("hidden");
            document.body.style.overflow = "";
            mobileMenuBtn.setAttribute("aria-expanded", "false");
        }

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener("click", openMobileMenu);
        }

        if (mobileMenuClose) {
            mobileMenuClose.addEventListener("click", closeMobileMenu);
        }

        if (mobileMenuOverlay) {
            mobileMenuOverlay.addEventListener("click", closeMobileMenu);
        }

        // Cerrar menú al hacer clic en un enlace
        mobileMenuLinks.forEach(link => {
            link.addEventListener("click", closeMobileMenu);
        });

        // Lightbox
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxClose = document.getElementById("lightbox-close");
        const lightboxPrev = document.getElementById("lightbox-prev");
        const lightboxNext = document.getElementById("lightbox-next");
        const galleryImages = document.querySelectorAll('.gallery-img[data-gallery]');
        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            lightboxImg.src = galleryImages[index].src;
            lightboxImg.alt = galleryImages[index].alt;
            lightbox.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.add("hidden");
            document.body.style.overflow = "";
        }

        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
            lightboxImg.src = galleryImages[currentImageIndex].src;
            lightboxImg.alt = galleryImages[currentImageIndex].alt;
        }

        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
            lightboxImg.src = galleryImages[currentImageIndex].src;
            lightboxImg.alt = galleryImages[currentImageIndex].alt;
        }

        // Abrir lightbox al hacer clic en imagen
        galleryImages.forEach((img, index) => {
            img.addEventListener("click", () => openLightbox(index));
        });

        // Cerrar lightbox
        if (lightboxClose) {
            lightboxClose.addEventListener("click", closeLightbox);
        }

        if (lightbox) {
            lightbox.addEventListener("click", function(e) {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });
        }

        // Navegación
        if (lightboxNext) {
            lightboxNext.addEventListener("click", (e) => {
                e.stopPropagation();
                showNextImage();
            });
        }

        if (lightboxPrev) {
            lightboxPrev.addEventListener("click", (e) => {
                e.stopPropagation();
                showPrevImage();
            });
        }

        // Cerrar con tecla ESC
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape" && !lightbox.classList.contains("hidden")) {
                closeLightbox();
            }
            if (e.key === "ArrowRight" && !lightbox.classList.contains("hidden")) {
                showNextImage();
            }
            if (e.key === "ArrowLeft" && !lightbox.classList.contains("hidden")) {
                showPrevImage();
            }
        });
    </script>
</body>

</html>
