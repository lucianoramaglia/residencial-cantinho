<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Em breve | Residencial Cantinho da Costeira</title>

  <link rel="icon" href="/resources/img/favicon.ico" />

  <style>
    :root {
      --blue-dark: #0a2c8c;
      --blue-main: #0d3cff;
      --blue-light: #4aa3ff;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--blue-dark), var(--blue-main));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 120px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
    }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      src="/resources/img/favicon-256x256.png"
      alt="Residencial Cantinho da Costeira"
      class="logo"
    />

    <h1>Estamos preparando algo especial</h1>

    <p>
      O site do <strong>Residencial Cantinho da Costeira</strong> está em
      construção e em breve estará no ar.<br />
      Enquanto isso, fale conosco pelo WhatsApp.
    </p>

    <a
      class="whatsapp"
      href="https://wa.me/5547974003344?text=Olá,%20gostaria%20de%20informações%20sobre%20disponibilidade%20no%20Residencial%20Cantinho%20da%20Costeira"
      target="_blank"
      rel="noopener"
    >
      💬 Falar no WhatsApp
    </a>

    <div class="footer">
      © Residencial Cantinho da Costeira
    </div>
  </div>
</body>
</html>
